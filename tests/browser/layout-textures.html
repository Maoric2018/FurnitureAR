<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Layout texture regression</title>
  <style>
    body{font:15px system-ui,sans-serif;margin:24px;background:#f5f4ef;color:#292d25}button{font:inherit;padding:10px 16px;margin:0 8px 12px 0}pre{white-space:pre-wrap;background:white;border:1px solid #d1d4ca;padding:16px;max-height:360px;overflow:auto}.case{margin:24px 0;padding:16px;background:white}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.viewer{height:320px;position:relative}.viewer model-viewer{width:100%;height:100%}.viewer-loading,.viewer-error{position:absolute;bottom:0;background:#fff;padding:4px}.viewer [slot]{display:none}.pass{color:#276234}.fail{color:#a32727}h2{font-size:18px}h3{font-size:15px}@media(max-width:700px){.pair{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>Layout texture regression</h1>
  <p>Uses real browser image decoding and the production layout export and Viewer components. No Amazon or generation calls.</p>
  <button id="run">Run texture round-trip checks</button>
  <button id="fallback-textures">Run texture fallback check</button>
  <button id="fail-textures">Run complete decoder failure check</button>
  <p id="status" role="status">Ready to run.</p>
  <pre id="report">Results appear here.</pre>
  <div id="previews"></div>
  <script type="module" src="./layout-textures.tsx"></script>
</body>
</html>
