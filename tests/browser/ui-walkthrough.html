<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data: ws://127.0.0.1:* ws://localhost:*; img-src 'self' blob: data:; media-src 'self' blob: data:; worker-src 'self' blob:;" />
  <title>Furniture AR — simulated UI walkthrough</title>
  <style>
    #ui-fixture{position:relative;z-index:9;margin-left:225px;padding:12px 24px;background:#fff3d5;border-bottom:2px solid #ab6a22;color:#382d18;font:12px/1.45 system-ui,sans-serif}
    #ui-fixture h1{font:600 15px/1.3 system-ui,sans-serif;margin:0 0 5px}
    #ui-fixture p{margin:5px 0}
    #ui-fixture .qa-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
    #ui-fixture button,#ui-fixture select{font:inherit;min-height:34px;padding:5px 8px;background:#fff;border:1px solid #af9572;border-radius:4px;color:#382d18}
    #ui-fixture label{display:flex;gap:5px;align-items:center}
    #ui-fixture output{display:block;margin-top:8px;overflow-wrap:anywhere}
    @media(max-width:650px){#ui-fixture{margin-left:0;padding:10px 12px}}
  </style>
</head>
<body>
  <section id="ui-fixture" aria-label="Simulated UI walkthrough controls">
    <h1>UI test · Simulated data, camera and APIs · No GPU requests</h1>
    <p>Real app below. Sample data is isolated; restore it when finished. External links and native scanner launches are simulated.</p>
    <div class="qa-controls">
      <button id="seed-samples">Load sample workspace</button><button id="seed-empty">Load empty workspace</button><button id="restore-data">Restore original data</button>
      <label>Camera <select id="camera-mode"><option value="simulated">Synthetic camera</option><option value="denied">Permission denied</option></select></label>
      <label>API <select id="api-mode"><option value="normal">Success</option><option value="empty">Empty search</option><option value="error">Service error</option><option value="slow">Slow response</option></select></label>
    </div>
    <div class="qa-controls">
      <label>Photo job <select id="photo-state"><option value="processing">Processing</option><option value="queued">Queued</option><option value="succeeded">Succeeded</option><option value="failed">Failed</option></select></label>
      <button id="load-photo-job">Load 30-second photo job</button><button id="reset-photo">Reset photo flow</button>
      <label>Amazon jobs <select id="amazon-state"><option value="auto">Per sample item</option><option value="pending">Processing</option><option value="ready">Ready</option><option value="failed">Failed</option><option value="storage_unavailable">Temporarily unavailable</option></select></label>
      <button id="download-photo">Download synthetic photo</button>
    </div>
    <output id="fixture-report" aria-live="polite">Starting fixture…</output>
  </section>
  <div id="root"></div>
  <script type="module" src="./ui-walkthrough.tsx"></script>
</body>
</html>
